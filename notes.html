<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notebase | Float Suite</title>
<link rel="icon" type="image/svg+xml" href="favicons/notes.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicons/notes-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicons/notes-16.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicons/notes-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicons/notes-180.png">
<link rel="shortcut icon" href="favicons/notes.ico">
<meta name="theme-color" content="#9966FF">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="shared/fonts.css">
<link rel="stylesheet" href="shared/float.css">
<style>
  /* ----- Notebase layout ------------------------------------------------ */
  :root{
    --notes-accent:#7C3AED;
    --notes-accent-dark:#7B3FE4;
  }
  .notes-layout{
    display:grid;
    grid-template-columns:300px 1fr;
    height:calc(100vh - var(--header-h) - var(--menu-h));
    overflow:hidden;
  }
  .notes-layout.zen{ grid-template-columns:1fr; }

  /* ----- Sidebar --------------------------------------------------------- */
  .sidebar{
    display:flex;flex-direction:column;min-height:0;
    background:var(--c-panel);
    border-right:var(--bw) solid var(--c-border);
  }
  .zen .sidebar{ display:none; }
  .sidebar-search{
    position:relative;padding:10px;
    border-bottom:var(--bw-sm) solid var(--c-border);
    display:flex;align-items:center;gap:8px;
  }
  .sidebar-search i.fa-magnifying-glass{
    color:var(--c-muted);font-size:12px;
  }
  .sidebar-search input{
    flex:1;min-width:0;background:var(--c-bg);
    border:var(--bw-sm) solid var(--c-border);
    color:var(--c-text);
    font-family:var(--font-ui);font-size:12px;
    padding:7px 9px;outline:none;
  }
  .sidebar-search input:focus{ border-color:var(--notes-accent); }
  .sidebar-scroll{ flex:1;overflow-y:auto;padding:8px;min-height:0; }

  .note-list{ display:flex;flex-direction:column;gap:8px; }
  .note-item{
    text-align:left;display:block;width:100%;
    background:var(--c-bg);border:var(--bw-sm) solid var(--c-border);
    padding:8px 10px;cursor:pointer;color:var(--c-text);
    font-family:var(--font-ui);
    box-shadow:2px 2px 0 var(--c-border);
transition:none;
  }
  .note-item:hover{ transform:translate(-1px,-1px); }
  .note-item.active{
    border-color:var(--notes-accent);
    box-shadow:0 0 0 1px var(--notes-accent), 2px 2px 0 var(--c-border);
  }
  .header-left{display:flex;align-items:center;gap:12px}
  .header-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .app-brand{font-family:var(--font-ui)}
  .app-logo{background:var(--notes-accent);color:#fff}
  .note-item .ni-title{
    display:flex;align-items:center;gap:6px;
    font-weight:700;font-size:13px;
  }
  .note-item .ni-title .ni-pin{
    margin-left:auto;background:none;border:none;cursor:pointer;
    color:var(--notes-accent);font-size:11px;padding:0;
  }
  .note-item .ni-preview{
    margin-top:2px;font-size:11px;line-height:1.4;
    color:var(--c-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .note-item .ni-meta{
    margin-top:4px;display:flex;gap:6px;align-items:center;
    font-size:10px;color:var(--c-muted);letter-spacing:.3px;
  }
  .note-item .ni-tags{ color:var(--notes-accent); }

  .sidebar-empty{
    text-align:center;color:var(--c-muted);font-size:12px;
    padding:24px 12px;line-height:1.6;
  }
  .backlinks{ margin-top:12px;border-top:var(--bw-sm) solid var(--c-border);padding-top:10px; }
  .backlinks h4{
    font-size:10px;text-transform:uppercase;letter-spacing:1px;
    color:var(--c-muted);margin:0 0 6px;
  }
  .backlinks a{
    display:block;padding:5px 8px;margin-bottom:4px;
    font-family:var(--font-ui);font-size:12px;font-weight:600;
    background:var(--c-surface2);border:var(--bw-sm) solid var(--c-border);
    cursor:pointer;color:var(--c-text);
  }
  .backlinks a:hover{ border-color:var(--notes-accent); }
  .backlinks .bl-none{ font-size:11px;color:var(--c-muted); }

  /* ----- Pane ------------------------------------------------------------- */
  .pane{ display:flex;flex-direction:column;min-width:0;min-height:0; }
  #editor-shell{ flex-direction:column; }
  .note-header{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;border-bottom:var(--bw-sm) solid var(--c-border);
    background:var(--c-panel);
  }
  .note-title-input{
    flex:1;min-width:0;background:transparent;border:none;outline:none;
    color:var(--c-text);font-weight:800;font-size:18px;
    font-family:var(--font-ui);
  }
  .note-title-input::placeholder{ color:var(--c-muted); }
  .view-toggle{ display:flex;gap:4px; }
  .view-btn{
    background:var(--c-bg);border:var(--bw-sm) solid var(--c-border);
    color:var(--c-muted);width:30px;height:30px;font-size:12px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .view-btn:hover{ color:var(--c-text); }
  .view-btn.active{
    background:var(--notes-accent);border-color:var(--c-border);
    color:#000;
  }

  .editors{
    flex:1;display:grid;grid-template-columns:1fr 1fr;
    min-height:0;
  }
  .editors.edit-only{ grid-template-columns:1fr; }
  .editors.preview-only{ grid-template-columns:1fr; }
  .editors.edit-only .note-preview{ display:none; }
  .editors.preview-only .note-body{ display:none; }

  .note-body{
    width:100%;height:100%;resize:none;border:none;outline:none;
    background:var(--c-bg);color:var(--c-text);
    font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.65;
    padding:16px 18px;
  }
  .note-preview{
    overflow-y:auto;background:var(--c-bg);
    border-left:var(--bw-sm) solid var(--c-border);
  }
  .editors.edit-only .note-preview{ border-left:none; }

  .statusbar{
    display:flex;align-items:center;gap:14px;
    padding:5px 14px;border-top:var(--bw-sm) solid var(--c-border);
    background:var(--c-panel);font-size:11px;color:var(--c-muted);
    font-family:var(--font-ui);
  }
  .statusbar .spacer{ flex:1; }

  .empty-state{
    flex:1;display:none;align-items:center;justify-content:center;
    text-align:center;color:var(--c-muted);font-size:14px;line-height:1.7;
    padding:40px;
  }
  .empty-state.show{ display:flex; }
  .empty-state .big{ font-size:40px;margin-bottom:10px; }

  /* ----- Markdown preview -------------------------------------------------- */
  .markdown-body{
    padding:28px 32px 80px;max-width:760px;margin:0 auto;
    font-family:var(--font-ui);font-size:14.5px;line-height:1.7;color:var(--c-text);
  }
  .markdown-body h1,.markdown-body h2,.markdown-body h3,
  .markdown-body h4,.markdown-body h5,.markdown-body h6{
    font-weight:800;line-height:1.3;margin:1.4em 0 .5em;
  }
  .markdown-body h1{ font-size:1.8em;border-bottom:2px solid var(--c-border);padding-bottom:.25em; }
  .markdown-body h2{ font-size:1.45em;border-bottom:1px solid var(--c-border);padding-bottom:.2em; }
  .markdown-body h3{ font-size:1.2em; }
  .markdown-body h4{ font-size:1.05em; }
  .markdown-body p{ margin:.7em 0; }
  .markdown-body a{ color:var(--notes-accent-dark);font-weight:600;text-decoration:underline; }
  .markdown-body ul,.markdown-body ol{ margin:.6em 0;padding-left:1.6em; }
  .markdown-body li{ margin:.25em 0; }
  .markdown-body li > ul,.markdown-body li > ol{ margin:0; }
  .markdown-body .task{ display:flex;align-items:flex-start;gap:8px;cursor:default; }
  .markdown-body .task input{ margin-top:3px;accent-color:var(--notes-accent); }
  .markdown-body blockquote{
    margin:1em 0;padding:.4em 1em;border-left:4px solid var(--notes-accent);
    background:var(--c-surface2);color:var(--c-muted);
  }
  .markdown-body blockquote p{ margin:.3em 0; }
  .markdown-body code{
    font-family:'JetBrains Mono',monospace;font-size:.88em;
    background:var(--c-surface2); border:var(--bw-sm) solid var(--c-border);
    padding:1px 5px;border-radius:2px;
  }
  .markdown-body pre{
    margin:1em 0;padding:12px 14px;overflow-x:auto;
    background:var(--c-panel);border:var(--bw-sm) solid var(--c-border);
  }
  .markdown-body pre code{ background:none;border:none;padding:0;font-size:.9em; }
  .markdown-body hr{
    border:none;border-top:2px dashed var(--c-border);margin:1.6em 0;
  }
  .markdown-body img{ max-width:100%;border:var(--bw-sm) solid var(--c-border); }
  .markdown-body table{
    border-collapse:collapse;margin:1em 0;width:100%;font-size:.95em;
  }
  .markdown-body th,.markdown-body td{
    border:var(--bw-sm) solid var(--c-border);padding:6px 10px;text-align:left;
  }
  .markdown-body th{ background:var(--c-panel);font-weight:700; }
  .markdown-body .wiki-link{
    color:var(--notes-accent-dark);font-weight:700;
    text-decoration:underline dotted;cursor:pointer;
  }
  .markdown-body .tag{
    color:var(--notes-accent-dark);font-weight:600;cursor:pointer;
    text-decoration:none;
  }
  .markdown-body .tag::before{ content:'#'; }

  /* ----- Modals ------------------------------------------------------------- */
  .export-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
  }
  .export-grid .btn{ justify-content:center; }
  .export-grid .btn .fa-solid{ margin-right:6px; }
  .export-grid .wide{ grid-column:1 / -1; }
  .copy-row{ margin-top:12px;display:flex;gap:8px;align-items:center; }
  .copy-row input{
    flex:1;min-width:0;background:var(--c-bg);
    border:var(--bw-sm) solid var(--c-border);color:var(--c-text);
    font-family:var(--font-ui);font-size:12px;padding:8px 10px;
  }

  /* ----- Responsive ---------------------------------------------------------- */
  @media (max-width:820px){
    .notes-layout{ grid-template-columns:1fr; }
    .sidebar{
      position:fixed;left:0;top:calc(var(--header-h) + var(--menu-h));bottom:0;width:270px;
      z-index:500;box-shadow:6px 0 0 rgba(0,0,0,.15);
      transform:translateX(-100%);transition:none;
    }
    .sidebar.open{ transform:translateX(0); }
    .editors{ grid-template-columns:1fr; }
    .editors .note-preview{ display:none; }
    .markdown-body{ padding:20px; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <a href="notes.html" class="app-logo" title="Notebase">
      <i class="fa-solid fa-book-open" style="font-size:13px;margin-right:5px"></i>
      NOTEBASE
      <span class="logo-suffix">v1.0</span>
    </a>
    <div class="app-brand" style="margin-left:12px">
      <span data-i18n="notes.tagline" style="font-size:12px;opacity:.7"></span>
    </div>
  </div>
  <div class="header-right">
    <button class="btn btn-sm btn-ghost" id="btn-new">
      <i class="fa-solid fa-plus"></i> <span data-i18n="notes.new_note">New Note</span>
    </button>
    <button class="btn btn-sm btn-ghost" id="btn-daily">
      <i class="fa-solid fa-calendar-day"></i> <span data-i18n="notes.daily">Daily Note</span>
    </button>
    <button class="btn btn-sm btn-ghost" id="btn-import">
      <i class="fa-solid fa-file-import"></i> <span data-i18n="common.import">Import</span>
    </button>
    <button class="btn btn-sm btn-primary" id="btn-export">
      <i class="fa-solid fa-file-export"></i> <span data-i18n="common.export">Export</span>
    </button>
    <button class="btn btn-sm btn-ghost" id="btn-sidebar" title="Toggle Sidebar">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>
</header>

<div id="app" class="notes-layout">

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="note-search" autocomplete="off" data-i18n="notes.search_placeholder" placeholder="Search notes…">
    </div>
    <div class="sidebar-scroll">
      <div id="note-list" class="note-list"></div>
      <div id="backlinks" class="backlinks"></div>
    </div>
  </aside>

  <main id="pane" class="pane">
    <div class="empty-state" id="empty-state">
      <div>
        <div class="big"><i class="fa-solid fa-book-open"></i></div>
        <p data-i18n="notes.none">Nothing here yet. Create your first note.</p>
        <button class="btn btn-primary" id="btn-empty-new" data-i18n="notes.new_note">New Note</button>
      </div>
    </div>
    <div id="editor-shell" style="display:none;flex:1;min-height:0">
      <div class="note-header">
        <input type="text" id="note-title" class="note-title-input" autocomplete="off" spellcheck="false">
        <div class="view-toggle">
          <button id="view-edit" class="view-btn" title="Edit"><i class="fa-solid fa-pen"></i></button>
          <button id="view-split" class="view-btn active" title="Split"><i class="fa-solid fa-columns"></i></button>
          <button id="view-preview" class="view-btn" title="Preview"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>
      <div id="editors" class="editors">
        <textarea id="note-body" class="note-body" spellcheck="true"></textarea>
        <div id="note-preview" class="note-preview markdown-body"></div>
      </div>
      <footer class="statusbar">
        <span id="sb-saved"></span>
        <span class="spacer"></span>
        <span id="sb-words"></span>
        <span id="sb-chars"></span>
      </footer>
    </div>
  </main>
</div>

<!-- Export modal -->
<div class="modal-overlay" id="modal-export">
  <div class="modal">
    <div class="modal-header">
      <h3 data-i18n="notes.modal_export_title"></h3>
      <button class="modal-close" data-close>&times;</button>
    </div>
    <div class="modal-body">
      <div class="export-grid">
        <button class="btn" id="exp-md"><i class="fa-solid fa-file-lines"></i> <span data-i18n="common.export_md">Markdown</span></button>
        <button class="btn" id="exp-txt"><i class="fa-solid fa-file-lines"></i> <span data-i18n="common.export_txt">TXT</span></button>
        <button class="btn" id="exp-html"><i class="fa-solid fa-file-code"></i> <span data-i18n="common.export_html">HTML</span></button>
        <button class="btn" id="exp-pdf"><i class="fa-solid fa-file-pdf"></i> <span data-i18n="common.export_pdf">PDF</span></button>
        <button class="btn" id="exp-docx"><i class="fa-solid fa-file-word"></i> <span data-i18n="common.export_docx">DOCX</span></button>
        <button class="btn" id="exp-odt"><i class="fa-solid fa-file-lines"></i> <span data-i18n="common.export_odt">ODT</span></button>
      </div>
      <div class="copy-row">
        <button class="btn" id="exp-copy"><i class="fa-solid fa-copy"></i> <span data-i18n="common.copy">Copy</span> <span data-i18n="common.export_md">MD</span></button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="Float.closeModal('modal-export')" data-i18n="common.cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- Delete modal -->
<div class="modal-overlay" id="modal-delete">
  <div class="modal">
    <div class="modal-header">
      <h3 data-i18n="notes.confirm_delete_title"></h3>
      <button class="modal-close" data-close>&times;</button>
    </div>
    <div class="modal-body">
      <p id="del-name" style="font-weight:700"></p>
      <p data-i18n="notes.confirm_delete_body" style="font-size:12px;opacity:.7">This cannot be undone.</p>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="Float.closeModal('modal-delete')" data-i18n="common.cancel">Cancel</button>
      <button class="btn btn-danger" id="del-ok" data-i18n="common.delete">Delete</button>
    </div>
  </div>
</div>

<input type="file" id="import-file" accept=".md,.markdown,.txt" hidden>

<script src="shared/i18n.js"></script>
<script src="shared/float.js"></script>
<script src="shared/exporters.js"></script>
<script>
(function(){
  'use strict';
  const {$,toast,uid,openModal,closeModal} = Float;
  const I = FloatI18n;

  class NotesApp {
    constructor(){
      this.notes = [];
      this.activeId = null;
      this.search = '';
      this.view = 'split';
      this.mobileOpen = false;
      this._saveTimer = null;
      this._renderTimer = null;
      this._deleting = null;
      this._cmdsRegistered = false;
    }

    init(){
      this.loadNotes();
      this.bindUI();
      this.bindHUD();
      Float.initModals();
      Float.applyTheme(Float.getThemeMode());
      Float.updateThemeIcons();
      I.apply();
      I.on(() => { this.bindHUD(); this.renderAll(); });
      if(!this.activeId){
        const first = this.notes.slice().sort((a,b) => (b.pinned - a.pinned) || (b.modified - a.modified))[0];
        if(first) this.activeId = first.id;
      }
      this.renderAll();
      window.addEventListener('beforeunload', () => this.persist());
    }

    /* ---- Storage ------------------------------------------------------- */
    loadNotes(){
      try{
        const raw = localStorage.getItem('notebase_notes');
        this.notes = raw ? JSON.parse(raw) : [];
      }catch(e){ this.notes = []; }
      if(!Array.isArray(this.notes)) this.notes = [];
      if(this.notes.length === 0){
        const now = new Date().getTime();
        this.notes.push({
          id: uid(),
          title: I.t('notes.welcome_title'),
          body: I.t('notes.welcome_body'),
          created: now,
          modified: now,
          pinned: true
        });
        this.persist(false);
      }
    }

    persist(quiet){
      try{
        localStorage.setItem('notebase_notes', JSON.stringify(this.notes));
      }catch(e){
        if(!quiet) toast(I.t('common.error'), 'danger');
        return;
      }
      const sb = $('#sb-saved');
      if(sb) sb.textContent = I.t('notes.saved') + ' · ' + new Date().toLocaleTimeString(I.getLang(), {hour:'2-digit', minute:'2-digit'});
    }

    byId(id){
      return this.notes.find(n => n.id === id);
    }

    scheduleSave(){
      clearTimeout(this._saveTimer);
      this._saveTimer = setTimeout(() => this.persist(true), 600);
    }

    queueRender(){
      clearTimeout(this._renderTimer);
      this._renderTimer = setTimeout(() => this.renderAll(), 180);
    }

    /* ---- View helpers --------------------------------------------------- */
    active(){
      return this.byId(this.activeId);
    }

    refreshActive(){
      const a = this.active();
      const shell = $('#editor-shell');
      const empty = $('#empty-state');
      if(!a){ shell.style.display = 'none'; empty.classList.add('show'); return; }
      empty.classList.remove('show');
      shell.style.display = 'flex';
      const title = $('#note-title'), body = $('#note-body');
      if(title.value !== a.title || document.activeElement !== title) title.value = a.title;
      if(body.value !== a.body || document.activeElement !== body) body.value = a.body;
      title.setAttribute('placeholder', I.t('notes.title_placeholder'));
    }

    applyView(){
      const ed = $('#editors');
      ed.classList.toggle('edit-only', this.view === 'edit');
      ed.classList.toggle('preview-only', this.view === 'preview');
      $('#view-edit').classList.toggle('active', this.view === 'edit');
      $('#view-split').classList.toggle('active', this.view === 'split');
      $('#view-preview').classList.toggle('active', this.view === 'preview');
    }

    /* ---- Rendering ------------------------------------------------------ */
    renderAll(){
      this.refreshActive();
      this.renderNoteList();
      this.renderBacklinks();
      this.renderPreview();
      this.updateCounts();
    }

    renderNoteList(){
      const list = $('#note-list');
      const q = this.search.toLowerCase();
      let notes = this.notes.filter(n => {
        if(!q) return true;
        return (n.title + '\n' + n.body).toLowerCase().includes(q);
      });
      notes = notes.slice().sort((a,b) => (b.pinned - a.pinned) || (b.modified - a.modified));
      if(notes.length === 0){
        list.innerHTML = '<div class="sidebar-empty">' + I.t('notes.none') + '</div>';
        return;
      }
      const pieces = [];
      for(const n of notes){
        const excerpt = n.body.replace(/\s+/g, ' ').slice(0, 70);
        const tags = this.tagsOf(n);
        pieces.push(
          '<button class="note-item' + (n.id === this.activeId ? ' active' : '') + '" data-id="' + n.id + '">' +
            '<span class="ni-title">' + this.esc(n.title || I.t('notes.untitled')) + (n.pinned ? ' <i class="fa-solid fa-thumbtack"></i>' : '') +
              '<button type="button" class="ni-pin" data-pin="' + n.id + '" title="' + I.t('notes.pinned') + '"><i class="fa-solid fa-' + (n.pinned ? 'thumbtack' : 'thumbtack-slash') + '"></i></button>' +
            '</span>' +
            (excerpt ? '<span class="ni-preview">' + this.esc(excerpt) + '</span>' : '') +
            '<span class="ni-meta">' +
              (tags.length ? '<span class="ni-tags">' + tags.map(t => '#' + this.esc(t)).join(' ') + '</span>' : '') +
              '<span class="ni-date">' + this.relDate(n.modified) + '</span>' +
            '</span>' +
          '</button>'
        );
      }
      list.innerHTML = pieces.join('');
    }

    renderBacklinks(){
      const box = $('#backlinks');
      const a = this.active();
      if(!a || this.search){ box.innerHTML = ''; return; }
      const title = a.title.trim().toLowerCase();
      const refs = this.notes.filter(n => n.id !== a.id && n.body.toLowerCase().includes('[[' + title + ']]') && n.body.toLowerCase().includes(title));
      let html = '';
      if(refs.length){
        html = '<h4>' + I.t('notes.backlinks') + '</h4>';
        for(const r of refs){
          html += '<a href="#" class="bl-link" data-id="' + r.id + '">' + this.esc(r.title || I.t('notes.untitled')) + '</a>';
        }
      }else{
        html = '<h4>' + I.t('notes.backlinks') + '</h4><div class="bl-none">' + I.t('notes.no_backlinks') + '</div>';
      }
      box.innerHTML = html;
    }

    renderPreview(){
      const pv = $('#note-preview');
      const a = this.active();
      if(!a){ pv.innerHTML = ''; return; }
      const scroll = pv.scrollTop;
      pv.innerHTML = this.mdToHtml(a.body);
      pv.scrollTop = scroll;
    }

    updateCounts(){
      const a = this.active();
      const w = $('#sb-words'), c = $('#sb-chars');
      if(!a){ w.textContent = ''; c.textContent = ''; return; }
      const words = a.body.trim() ? a.body.trim().split(/\s+/).length : 0;
      w.textContent = I.t('notes.words', {n: words});
      c.textContent = I.t('notes.chars', {n: a.body.length});
    }

    relDate(ts){
      try{ return new Date(ts).toLocaleDateString(I.getLang()); }
      catch(e){ return ''; }
    }

    tagsOf(note){
      const set = [];
      const re = /(?:^|\s)#([\p{L}\p{N}_][\p{L}\p{N}_-]*)/gu;
      let m;
      while((m = re.exec(note.body))){
        if(set.length >= 3) break;
        if(!set.includes(m[1])) set.push(m[1]);
      }
      return set;
    }

    /* ---- Markdown ------------------------------------------------------- */
    esc(s){
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    isTableStart(lines, idx){
      const a = lines[idx], b = lines[idx+1];
      return !!(a && a.includes('|') && b && /^\s*\|?[\s:|-]+\|[\s:|-]*\s*$/.test(b.trim()));
    }

    mdToHtml(src){
      const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
      let out = [];
      let i = 0;
      const isListLine = l => /^\s*(?:[-*+]|\d+\.)\s+/.test(l);
      const isBlockish = l => !!(l && (isListLine(l) || /^#{1,6}\s/.test(l) || /^>\s?/.test(l) || /^```/.test(l) || /^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(l)));
      while(i < lines.length){
        const line = lines[i];
        if(!line.trim()){ i++; continue; }
        const fence = line.match(/^```{1,}(\w*)\s*$/);
        if(fence){
          const buf = [];
          i++;
          while(i < lines.length && !/^```\s*$/.test(lines[i])){ buf.push(lines[i]); i++; }
          i++;
          out.push('<pre><code>' + this.esc(buf.join('\n')) + '</code></pre>');
          continue;
        }
        const h = line.match(/^(#{1,6})\s+(.*)$/);
        if(h){ out.push('<h' + h[1].length + '>' + this.inline(h[2].trim()) + '</h' + h[1].length + '>'); i++; continue; }
        if(/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)){ out.push('<hr>'); i++; continue; }
        if(/^>\s?/.test(line)){
          const buf = [];
          while(i < lines.length && /^>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^>\s?/, '')); i++; }
          out.push('<blockquote>' + buf.map(l => '<p>' + this.inline(l) + '</p>').join('') + '</blockquote>');
          continue;
        }
        if(this.isTableStart(lines, i)){
          const rows = [];
          while(i < lines.length && lines[i].trim().includes('|')){ rows.push(lines[i]); i++; }
          out.push(this.renderTable(rows));
          continue;
        }
        if(isListLine(line)){
          const items = [];
          while(i < lines.length){
            const c = lines[i];
            if(isListLine(c)){ items.push(c); i++; }
            else if(!c.trim()){ if(isListLine(lines[i+1])){ i++; continue; } break; }
            else break;
          }
          out.push(this.renderList(items));
          continue;
        }
        const para = [];
        while(i < lines.length && lines[i].trim() && !isBlockish(lines[i]) && !this.isTableStart(lines, i)){
          para.push(lines[i]); i++;
        }
        if(para.length){ out.push('<p>' + this.inline(para.join('\n')).replace(/\n/g, '<br>') + '</p>'); continue; }
        i++;
      }
      return out.join('\n');
    }

    renderTable(rows){
      const split = r => r.replace(/^\s*\|?/, '').replace(/\|?\s*$/, '').split('|').map(c => c.trim());
      let h = '<table><thead><tr>';
      split(rows[0]).forEach(c => h += '<th>' + this.inline(c) + '</th>');
      h += '</tr></thead><tbody>';
      rows.slice(1).forEach(r => {
        h += '<tr>';
        split(r).forEach(c => h += '<td>' + (c ? this.inline(c) : '') + '</td>');
        h += '</tr>';
      });
      return h + '</tbody></table>';
    }

    renderList(items){
      const parsed = items.map(it => {
        const m = it.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        return {indent: m[1].length, ordered: /^\d+\.$/.test(m[2]), text: m[3]};
      });
      const build = (idx, minIndent) => {
        if(idx >= parsed.length) return {html:'', next: idx};
        const tag = parsed[idx].ordered ? 'ol' : 'ul';
        let h = '<' + tag + '>';
        while(idx < parsed.length){
          const p = parsed[idx];
          if(p.indent < minIndent && idx > 0) break;
          if(p.indent > minIndent){
            const r = build(idx, p.indent);
            h = h.replace(/<\/li>\s*$/, '') + r.html + '</li>';
            idx = r.next;
            continue;
          }
          const task = p.text.match(/^\[([ xX])\]\s+(.*)$/);
          const li = task
            ? '<label class="task"><input type="checkbox" disabled' + (/[xX]/.test(task[1]) ? ' checked' : '') + '>' + this.inline(task[2]) + '</label>'
            : this.inline(p.text);
          h += '<li>' + li;
          if(parsed[idx+1] && parsed[idx+1].indent > p.indent){
            const r = build(idx+1, parsed[idx+1].indent);
            h += r.html + '</li>';
            idx = r.next;
          }else{
            h += '</li>';
            idx++;
          }
        }
        h += '</' + tag + '>';
        return {html:h, next: idx};
      };
      return build(0, parsed[0].indent).html;
    }

    inline(text){
      let codes = [];
      let s = this.esc(text);
      s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push('<code>' + c + '</code>'); return '\u0001' + (codes.length - 1) + '\u0001'; });
      s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, url) => '<img src="' + this.esc(url) + '" alt="' + this.esc(alt) + '" loading="lazy">');
      s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, txt, url) => {
        const u = url.trim();
        return /^(https?:|mailto:)/.test(u)
          ? '<a href="' + this.esc(u) + '" target="_blank" rel="noopener">' + txt + '</a>'
          : '<a href="' + this.esc(u) + '">' + txt + '</a>';
      });
      s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
      s = s.replace(/~~([^~\n]+)~~/g, '<s>$1</s>');
      s = s.replace(/\[\[([^\[\]\n]+)\]\]/g, (_, nm) => {
        const t = nm.trim();
        return '<a href="#" class="wiki-link" data-title="' + this.esc(t) + '" title="' + this.esc(t) + '">' + this.esc(t) + '</a>';
      });
      s = s.replace(/(^|[\s>])(#[\p{L}\p{N}_][\p{L}\p{N}_-]*)/gu, (_, pre, tag) => pre + '<a href="#" class="tag" data-tag="' + this.esc(tag.slice(1)) + '">' + tag.slice(1) + '</a>');
      s = s.replace(/\u0001(\d+)\u0001/g, (_, i) => codes[+i] || '');
      return s;
    }

    /* ---- Note actions --------------------------------------------------- */
    createNote(title){
      const now = new Date().getTime();
      const n = {id: uid(), title: title || I.t('notes.untitled'), body: '', created: now, modified: now, pinned: false};
      this.notes.push(n);
      this.persist(true);
      this.openNote(n.id);
      toast(I.t('notes.toast_created'), 'success', 1400);
      setTimeout(() => $('#note-title').focus(), 30);
      return n;
    }

    openNoteById(id){
      this.openNote(id);
    }

    openNote(id){
      if(!this.byId(id)) return;
      this.activeId = id;
      this.renderAll();
      $('#note-search').value = '';
      this.search = '';
    }

    openNoteByTitle(title){
      const t = title.trim();
      const found = this.notes.find(n => n.title.trim().toLowerCase() === t.toLowerCase());
      if(found){ this.openNote(found.id); return; }
      const n = this.createNote(t);
      this.openNote(n.id);
    }

    dailyNote(){
      const d = new Date().toISOString().slice(0, 10);
      const found = this.notes.find(n => n.title.trim().toLowerCase() === d);
      if(found){ this.openNote(found.id); return; }
      this.createNote(d);
    }

    askDelete(id){
      const n = this.byId(id);
      if(!n) return;
      this._deleting = id;
      $('#del-name').textContent = '"' + (n.title || I.t('notes.untitled')) + '"';
      openModal('modal-delete');
    }

    doDelete(){
      const id = this._deleting;
      this._deleting = null;
      closeModal('modal-delete');
      const idx = this.notes.findIndex(n => n.id === id);
      if(idx === -1) return;
      this.notes.splice(idx, 1);
      this.persist(true);
      if(this.activeId === id) this.activeId = null;
      this.renderAll();
      if(this.notes.length === 0) this.createNote();
      toast(I.t('notes.toast_deleted'), 'success', 1400);
    }

    togglePin(id){
      const n = this.byId(id);
      if(!n) return;
      n.pinned = !n.pinned;
      n.modified = n.modified;
      this.persist(true);
      this.renderNoteList();
    }

    /* ---- Import ---------------------------------------------------------- */
    openImport(){
      $('#import-file').click();
    }

    handleImport(ev){
      const file = ev.target.files && ev.target.files[0];
      ev.target.value = '';
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const title = file.name.replace(/\.[^.]+$/, '');
        const n = this.createNote(title);
        n.body = String(reader.result || '');
        n.modified = new Date().getTime();
        this.persist(true);
        this.renderAll();
        toast(I.t('notes.toast_imported', {name: file.name}), 'success', 1600);
      };
      reader.onerror = () => toast(I.t('common.error'), 'danger');
      reader.readAsText(file);
    }

    /* ---- Export ----------------------------------------------------------- */
    defaultName(){
      const a = this.active();
      if(!a) return 'note';
      const base = (a.title || 'note').replace(/[\\/:*?"<>|]+/g, '-').trim().toLowerCase();
      return base || 'note';
    }

    exportNode(){
      const wrap = document.createElement('div');
      wrap.className = 'notes-export-wrap';
      wrap.style.cssText = 'background:#fff;color:#111;font-family:Inter,Helvetica,Arial,sans-serif;padding:24px;';
      const h = document.createElement('h1');
      h.style.cssText = 'font-size:24px;font-weight:800;margin:0 0 8px;';
      h.textContent = this.active().title;
      const body = document.createElement('div');
      body.className = 'markdown-body';
      body.style.maxWidth = 'none';
      body.innerHTML = this.mdToHtml(this.active().body);
      body.querySelectorAll('a.wiki-link, a.tag').forEach(a => {
        const t = document.createTextNode(a.textContent);
        a.replaceWith(t);
      });
      wrap.appendChild(h);
      wrap.appendChild(body);
      return wrap;
    }

    exportFileName(format){
      return FloatExport.sanitizeFilename(this.defaultName(), format);
    }

    openExport(){
      openModal('modal-export');
    }

    exportMarkdown(){
      const a = this.active();
      const content = '# ' + a.title + '\n\n' + a.body + '\n';
      const blob = new Blob([content], {type:'text/markdown'});
      FloatExport.saveBlob(blob, this.exportFileName('md'));
      toast(I.t('common.exported'), 'success');
      closeModal('modal-export');
    }

    exportTxt(){
      const a = this.active();
      const blob = new Blob([a.title + '\n\n' + a.body + '\n'], {type:'text/plain'});
      FloatExport.saveBlob(blob, this.exportFileName('txt'));
      toast(I.t('common.exported'), 'success');
      closeModal('modal-export');
    }

    exportHTML(){
      const a = this.active();
      let render = this.mdToHtml(a.body);
      render = render.replace(/<a href="#" class="(?:wiki-link|tag)"[^>]*>(.*?)<\/a>/g, '$1');
      const name = this.defaultName();
      const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + this.esc(name) + '</title>' +
        '<style>body{font-family:Inter,Helvetica,Arial,sans-serif;font-size:15px;color:#111;line-height:1.7;max-width:760px;margin:0 auto;padding:40px 20px}h1,h2,h3{font-weight:800}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:6px 10px;text-align:left}blockquote{border-left:4px solid #9966FF;margin:0;padding:0 16px;color:#555}code{background:#f0edfa;padding:1px 5px}pre{background:#f0edfa;padding:12px;overflow:auto}img{max-width:100%}hr{border:none;border-top:2px dashed #bbb;margin:1.6em 0}</style>' +
        '</head><body><h1>' + this.esc(a.title) + '</h1>' + render + '</body></html>';
      const blob = new Blob([html], {type:'text/html'});
      FloatExport.saveBlob(blob, FloatExport.sanitizeFilename(name, 'html'));
      toast(I.t('common.exported'), 'success');
      closeModal('modal-export');
    }

    exportPDF(){
      const a = this.active();
      toast(I.t('thesis.toast_generating', {fmt:'PDF'}), 'info', 1500);
      const node = this.exportNode();
      const temp = document.createElement('div');
      temp.style.position = 'fixed';
      temp.style.left = '-9999px';
      temp.style.top = '0';
      temp.style.background = '#fff';
      temp.appendChild(node);
      document.body.appendChild(temp);
      const run = () => {
        html2canvas(node, {scale:2, useCORS:true, backgroundColor:'#FFFFFF', scrollY:0}).then(canvas => {
          temp.remove();
          FloatExport.canvasToPDF(canvas, this.defaultName(), {background:'#FFFFFF', orientation:'portrait', margin_mm:0})
            .then(() => { toast(I.t('common.exported'), 'success'); closeModal('modal-export'); })
            .catch(err => { console.error(err); temp.remove(); toast(I.t('common.failed') + ': ' + err.message, 'danger'); });
        }).catch(err => {
          temp.remove();
          console.error(err);
          toast(I.t('common.failed') + ': ' + err.message, 'danger');
        });
      };
      if(typeof html2canvas === 'undefined'){
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        s.onload = run;
        s.onerror = () => { temp.remove(); toast(I.t('thesis.toast_failed_html2canvas'), 'danger'); };
        document.head.appendChild(s);
      }else{
        run();
      }
    }

    exportDOCX(){
      const a = this.active();
      toast(I.t('thesis.toast_generating', {fmt:'DOCX'}), 'info', 1500);
      FloatExport.htmlToDocx(this.exportNode(), this.defaultName(), {title:a.title, author:'Float Suite Notebase'})
        .then(() => { toast(I.t('common.exported'), 'success'); closeModal('modal-export'); })
        .catch(err => { console.error(err); toast(I.t('common.failed') + ': ' + err.message, 'danger'); });
    }

    exportODT(){
      const a = this.active();
      toast(I.t('thesis.toast_generating', {fmt:'ODT'}), 'info', 1500);
      FloatExport.htmlToODT(this.exportNode(), this.defaultName(), {title:a.title})
        .then(() => { toast(I.t('common.exported'), 'success'); closeModal('modal-export'); })
        .catch(err => { console.error(err); toast(I.t('common.failed') + ': ' + err.message, 'danger'); });
    }

    async copyMarkdown(){
      const a = this.active();
      if(!a) return;
      const text = '# ' + a.title + '\n\n' + a.body + '\n';
      try{
        await navigator.clipboard.writeText(text);
        toast(I.t('paint.toast_copied'), 'success', 1200);
      }catch(e){
        toast(I.t('common.failed'), 'danger');
      }
    }

    /* ---- UI binding -------------------------------------------------------- */
    bindUI(){
      $('#btn-new').addEventListener('click', () => this.createNote());
      $('#btn-empty-new').addEventListener('click', () => this.createNote());
      $('#btn-daily').addEventListener('click', () => this.dailyNote());
      $('#btn-import').addEventListener('click', () => this.openImport());
      $('#btn-export').addEventListener('click', () => this.openExport());
      $('#btn-sidebar').addEventListener('click', () => {
        this.mobileOpen = !this.mobileOpen;
        $('#sidebar').classList.toggle('open', this.mobileOpen);
      });

      $('#import-file').addEventListener('change', e => this.handleImport(e));

      $('#note-search').addEventListener('input', e => {
        this.search = e.target.value.trim().toLowerCase();
        this.renderNoteList();
        this.renderBacklinks();
      });

      $('#note-title').addEventListener('input', () => this.onTitleInput());
      $('#note-body').addEventListener('input', () => this.onBodyInput());

      $('#note-list').addEventListener('click', e => {
        const pin = e.target.closest('.ni-pin');
        if(pin){ e.stopPropagation(); e.preventDefault(); this.togglePin(pin.dataset.pin); return; }
        const item = e.target.closest('.note-item');
        if(item){ this.openNote(item.dataset.id); this.mobileOpen = false; $('#sidebar').classList.remove('open'); }
      });

      $('#backlinks').addEventListener('click', e => {
        const a = e.target.closest('.bl-link');
        if(a){ e.preventDefault(); this.openNote(a.dataset.id); }
      });

      $('#note-preview').addEventListener('click', e => {
        const w = e.target.closest('.wiki-link');
        if(w){ e.preventDefault(); this.openNoteByTitle(w.dataset.title); return; }
        const t = e.target.closest('.tag');
        if(t){
          e.preventDefault();
          const search = $('#note-search');
          search.value = t.dataset.tag;
          this.search = t.dataset.tag.toLowerCase();
          this.renderNoteList();
          search.focus();
        }
      });

      $('#view-edit').addEventListener('click', () => { this.view = 'edit'; this.applyView(); this.renderPreview(); });
      $('#view-split').addEventListener('click', () => { this.view = 'split'; this.applyView(); this.renderPreview(); });
      $('#view-preview').addEventListener('click', () => { this.view = 'preview'; this.applyView(); this.renderPreview(); });

      $('#exp-md').addEventListener('click', () => this.exportMarkdown());
      $('#exp-txt').addEventListener('click', () => this.exportTxt());
      $('#exp-html').addEventListener('click', () => this.exportHTML());
      $('#exp-pdf').addEventListener('click', () => this.exportPDF());
      $('#exp-docx').addEventListener('click', () => this.exportDOCX());
      $('#exp-odt').addEventListener('click', () => this.exportODT());
      $('#exp-copy').addEventListener('click', () => this.copyMarkdown());
      $('#del-ok').addEventListener('click', () => this.doDelete());

      document.addEventListener('keydown', e => {
        if(e.key === 'Escape' && this.mobileOpen){
          this.mobileOpen = false;
          $('#sidebar').classList.remove('open');
        }
      });
    }

    onTitleInput(){
      const a = this.active();
      if(!a) return;
      if($('#note-title').value.trim()) a.title = $('#note-title').value.trim();
      else a.title = I.t('notes.untitled');
      a.modified = new Date().getTime();
      this.scheduleSave();
      this.queueRender();
    }

    onBodyInput(){
      const a = this.active();
      if(!a) return;
      a.body = $('#note-body').value;
      a.modified = new Date().getTime();
      this.scheduleSave();
      this.queueRender();
      this.updateCounts();
    }

        {id:'file.delete', i18n:'common.delete', group:'file', run:() => this.askDelete(this.activeId)},
        {id:'edit.search', i18n:'common.search', group:'edit', run:() => this.focusSearch()},
        {id:'edit.copyMD', i18n:'common.copy', group:'edit', run:() => this.copyMarkdown()},
        {id:'view.edit', i18n:'notes.edit', group:'view', run:() => { this.view='edit'; this.applyView(); this.renderPreview(); }},
        {id:'view.split', i18n:'notes.split', group:'view', run:() => { this.view='split'; this.applyView(); this.renderPreview(); }},
        {id:'view.preview', i18n:'notes.preview', group:'view', run:() => { this.view='preview'; this.applyView(); this.renderPreview(); }},
        {id:'view.zen', i18n:'thesis.zen_mode', group:'view', run:() => this.toggleZen()},
        {id:'help.shortcuts', i18n:'common.shortcuts', group:'help', run:() => Float.showShortcuts()},

      Float.addShortcut({key:'D', mod:['Ctrl','Alt'], fn:() => this.dailyNote(), label:I.t('notes.daily'), group:'file'});
      Float.addShortcut({key:'E', mod:['Ctrl'], fn:() => this.openExport(), label:I.t('common.export'), group:'file'});
      Float.addShortcut({key:'F', mod:['Ctrl'], fn:() => this.focusSearch(), label:I.t('common.search'), group:'edit'});
      Float.addShortcut({key:'F11', fn:() => this.toggleZen(), label:I.t('thesis.zen_mode'), group:'view'});
      Float.addShortcut({key:'Delete', mod:['Ctrl'], fn:() => this.askDelete(this.activeId), label:I.t('common.delete'), group:'file'});
    }

    focusSearch(){
      const el = $('#note-search');
      el.focus();
      el.select();
    }

    toggleZen(){
      $('#app').classList.toggle('zen');
      toast(I.t('thesis.toast_zen'), 'success', 1200);
    }

    saveNow(){
      clearTimeout(this._saveTimer);
      this.persist(true);
      toast(I.t('notes.toast_saved'), 'success', 1200);
    }
  }

  const app = new NotesApp();
  document.addEventListener('DOMContentLoaded', () => app.init());
})();
</script>
</body>
</html>
